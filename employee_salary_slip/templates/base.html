<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Employee Salary Slip{% endblock %}</title>
<style>
:root{--ink:#172033;--muted:#687386;--line:#e3e8f0;--bg:#f5f7fb;--blue:#3457d5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:17px 22px}.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;color:var(--ink);text-decoration:none}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{padding:9px 10px;border-radius:8px;text-decoration:none;color:#364152;font-size:14px}.links a:hover{background:#eef2ff}
main{max-width:1100px;margin:30px auto;padding:0 18px}h1{font-size:29px;margin:0 0 8px}h2{font-size:19px}.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:9px;padding:10px 14px;text-decoration:none;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--blue);color:#fff}.soft{background:#edf0f6;color:var(--ink)}.danger{background:#fff0f0;color:#b42318}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:22px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat strong{display:block;font-size:27px;margin-bottom:6px}
.toolbar,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar{margin:15px 0}.toolbar input{flex:1;min-width:200px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ccd4e1;border-radius:8px;font:inherit;background:#fff}label{display:block;font-weight:700;margin:16px 0 7px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;text-transform:uppercase;color:var(--muted)}tr:last-child td{border-bottom:0}.table-wrap{overflow-x:auto}
.message{background:#eaf8ef;color:#17663a;padding:12px;border-radius:8px;margin-bottom:12px}.rowhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.slip-head{text-align:center;border-bottom:2px solid #222;padding-bottom:15px}.slip-head h2{margin-bottom:5px}.money{text-align:right;font-variant-numeric:tabular-nums}.total-row td{font-weight:800;background:#f5f7fb}
@media(max-width:650px){.stats{grid-template-columns:1fr}.stat strong{font-size:23px}}
@media print{header,.no-print,.message{display:none!important}body{background:#fff;color:#000}main{max-width:none;margin:0;padding:0}.card{border:0;padding:0;margin:0}.slip{border:1px solid #999;padding:25px!important}.stats{display:none}}
</style></head>
<body><header><div class="nav"><a class="brand" href="{% url 'dashboard' %}">▤ Employee Salary Slip</a><nav class="links"><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'employee_list' %}">Employees</a><a href="{% url 'slip_list' %}">Salary slips</a><a href="{% url 'employee_create' %}">Add employee</a><a href="/admin/">Admin</a></nav></div></header>
<main>{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
